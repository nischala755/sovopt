[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "sovereign-optimizer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sovereign-api = "service.__main__:main"

[tool.scikit-build]
cmake.source-dir = "python"
wheel.packages = ["service"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/python"]

